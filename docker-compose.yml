services:
  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-univerreviews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-univerreviews_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-univerreviews}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (Object Storage) ─────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-univerreviews}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── MinIO Init (create bucket) ─────────────────────────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-univerreviews} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/univer-media;
      mc anonymous set download local/univer-media/public;
      exit 0;
      "

  # ─── Rails API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-univerreviews}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-univerreviews_production}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-univerreviews}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: univer-media
      RESEND_API_KEY: ${RESEND_API_KEY}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}
      UNIVERCAMPUS_API_URL: ${UNIVERCAMPUS_API_URL:-https://univercampus.cloud}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: https://dash.univerreviews.com
      ADMIN_URL: https://dash.univerreviews.com
      API_URL: https://api.univerreviews.com
      RAILS_LOG_TO_STDOUT: "true"
      FORCE_SSL: "false"
    expose:
      - "3000"
    # db:prepare runs migrations including Better Auth schema bootstrap.
    # Then auth:migrate backfills legacy WorkspaceUsers into Better Auth (idempotent).
    command: bash -c "bundle exec rails db:prepare && bundle exec rails auth:migrate && bundle exec puma -C config/puma.rb"

  # ─── Sidekiq (Background Jobs) ──────────────────────────────────────────────
  sidekiq:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-univerreviews}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-univerreviews_production}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-univerreviews}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: univer-media
      RESEND_API_KEY: ${RESEND_API_KEY}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}
      UNIVERCAMPUS_API_URL: ${UNIVERCAMPUS_API_URL:-https://univercampus.cloud}
      ADMIN_URL: https://dash.univerreviews.com
      FRONTEND_URL: https://dash.univerreviews.com
      RAILS_LOG_TO_STDOUT: "true"
      FORCE_SSL: "false"
    command: bash -c "until bundle exec rails runner 'ActiveRecord::Base.connection.execute(\"SELECT 1 FROM schema_migrations LIMIT 1\")' 2>/dev/null; do echo 'waiting for migrations'; sleep 3; done; bundle exec sidekiq -C config/sidekiq.yml"

  # ─── Next.js Admin Dashboard ────────────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.univerreviews.com
        NEXT_PUBLIC_WIDGET_URL: https://api.univerreviews.com/widget.js
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-univerreviews}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-univerreviews_production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://dash.univerreviews.com
      BETTER_AUTH_TRUSTED_ORIGINS: https://dash.univerreviews.com,https://api.univerreviews.com
      NEXT_PUBLIC_ADMIN_URL: https://dash.univerreviews.com
      NEXT_PUBLIC_API_URL: https://api.univerreviews.com
      NEXT_PUBLIC_WIDGET_URL: https://api.univerreviews.com/widget.js
      RESEND_API_KEY: ${RESEND_API_KEY}
      AUTH_FROM_EMAIL: ${AUTH_FROM_EMAIL:-auth@univerreviews.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
